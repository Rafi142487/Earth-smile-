<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261B"/>
      <stop offset="100%" stop-color="#243D2D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B777"/>
      <stop offset="100%" stop-color="#BD7B3C"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle organic decorative elements -->
  <circle cx="1100" cy="100" r="300" fill="#2E4C38" opacity="0.4"/>
  <circle cx="100" cy="550" r="250" fill="#2E4C38" opacity="0.3"/>
  
  <!-- Icon Logo Emblem -->
  <g transform="translate(120, 140)">
    <rect width="100" height="100" rx="24" fill="#EAE5D9" opacity="0.1"/>
    <!-- Tooth / Leaf Motif -->
    <path d="M50 25 C38 40 32 54 50 66 C68 54 62 40 50 25 Z" fill="#8BB391"/>
    <!-- Smile Arc -->
    <path d="M28 72 Q 50 92 72 72" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Typography -->
  <text x="245" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="#F4F1EA" letter-spacing="4">EARTH SMILE</text>
  <text x="248" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#A8BAAB" letter-spacing="6">NATURAL ORAL CARE</text>
  
  <text x="120" y="340" font-family="serif" font-size="58" font-style="italic" fill="#FFFFFF" font-weight="400">Thoughtfully crafted bamboo dental essentials.</text>
  
  <text x="120" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#D6DFD7">
    Organic Bamboo Toothbrushes • Ergonomic Bamboo Tongue Cleaners • Private-Label Branding
  </text>
  
  <!-- Badge -->
  <g transform="translate(120, 480)">
    <rect width="310" height="52" rx="26" fill="url(#gold)"/>
    <text x="155" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#14261B" text-anchor="middle" letter-spacing="1">100% BIODEGRADABLE • ZERO PLASTIC</text>
  </g>
  
  <text x="1080" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#8BB391" text-anchor="end">earthsmile.in</text>
</svg>
