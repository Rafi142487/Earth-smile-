<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Recycled Kraft Cardboard Gradient -->
    <linearGradient id="kraftBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D9B78B" />
      <stop offset="40%" stopColor="#CBA577" />
      <stop offset="80%" stopColor="#BF9866" />
      <stop offset="100%" stopColor="#B38B57" />
    </linearGradient>

    <!-- Natural Bamboo Strip Gradient -->
    <linearGradient id="bambooStripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#E0D1B8" />
      <stop offset="35%" stopColor="#D2BE9E" />
      <stop offset="70%" stopColor="#C4AD88" />
      <stop offset="100%" stopColor="#B3976F" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="15" dy="25" stdDeviation="16" flood-color="#141a16" flood-opacity="0.14" />
    </filter>
    <filter id="stripShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="20" stdDeviation="12" flood-color="#141a16" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="800" height="800" fill="#FFFFFF" />

  <!-- ==================== LEFT: KRAFT PACKAGING BOX ==================== -->
  <g transform="translate(140, 110)" filter="url(#boxShadow)">
    <!-- Box Body -->
    <rect x="0" y="30" width="310" height="610" rx="8" fill="url(#kraftBoxGrad)" stroke="#9E7848" stroke-width="1.5" />
    
    <!-- Top Euro Hang Tab -->
    <path d="M 125 30 L 125 10 C 125 4, 185 4, 185 10 L 185 30 Z" fill="#BF9866" stroke="#9E7848" stroke-width="1.5" />
    <rect x="135" y="16" width="40" height="12" rx="6" fill="#FFFFFF" stroke="#9E7848" stroke-width="1" />

    <!-- Big Headline on Box -->
    <text x="155" y="95" text-anchor="middle" fill="#1C1B1A" font-size="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" letter-spacing="2">
      BAMBOO
    </text>
    <text x="155" y="132" text-anchor="middle" fill="#1C1B1A" font-size="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" letter-spacing="2">
      TONGUE
    </text>
    <text x="155" y="169" text-anchor="middle" fill="#1C1B1A" font-size="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" letter-spacing="2">
      CLEANER
    </text>

    <!-- Cartoon Tongue Illustration Silhouette -->
    <g transform="translate(55, 195)">
      <!-- Tongue curve arch -->
      <path d="M 30 250 L 30 80 C 30 15, 170 15, 170 80 L 170 250" stroke="#1C1B1A" stroke-width="8" stroke-linecap="round" fill="none" />
      <!-- Eyes: inverted arcs -->
      <path d="M 68 75 Q 80 58 92 75" stroke="#1C1B1A" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <path d="M 108 75 Q 120 58 132 75" stroke="#1C1B1A" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <!-- Smile mouth -->
      <path d="M 85 105 Q 100 118 115 105" stroke="#1C1B1A" stroke-width="4" fill="none" stroke-linecap="round" />
      <!-- Text under illustration -->
      <text x="100" y="142" text-anchor="middle" fill="#1C1B1A" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600">
        It does not
      </text>
      <text x="100" y="160" text-anchor="middle" fill="#1C1B1A" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600">
        kill taste buds
      </text>
    </g>

    <!-- Bottom Dark Banner with Feature Bullets -->
    <rect x="0" y="475" width="310" height="165" rx="4" fill="#1C1B1A" />
    <g fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">
      <text x="155" y="505" font-size="12" font-weight="700" letter-spacing="1">
        100% Organic
      </text>
      <line x1="20" y1="517" x2="290" y2="517" stroke="#3A3835" stroke-width="1" />
      <text x="155" y="534" font-size="10.5" font-weight="500">
        Smooth scraping of tongue surface
      </text>
      <line x1="20" y1="544" x2="290" y2="544" stroke="#3A3835" stroke-width="1" />
      <text x="155" y="561" font-size="10" font-weight="500">
        Prevents bad odour/foul smelling from mouth
      </text>
      <line x1="20" y1="571" x2="290" y2="571" stroke="#3A3835" stroke-width="1" />
      <text x="155" y="588" font-size="10.5" font-weight="600">
        Ergonomic design
      </text>
      <line x1="20" y1="597" x2="290" y2="597" stroke="#3A3835" stroke-width="1" />
      <text x="155" y="612" font-size="10" font-weight="500">
        Made from finest quality bamboo
      </text>
      <text x="155" y="629" font-size="10" font-weight="600" fill="#E0A361">
        lightweight
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT: BAMBOO TONGUE CLEANER STANDING ==================== -->
  <g transform="translate(540, 220)" filter="url(#stripShadow)">
    <!-- Natural arched bamboo ribbon tongue cleaner -->
    <path d="M 0 450 L 0 160 C 0 30, 160 30, 160 160 L 220 500" 
          stroke="url(#bambooStripGrad)" stroke-width="26" stroke-linecap="round" fill="none" />
    <!-- Outer edge natural bamboo highlight -->
    <path d="M 0 450 L 0 160 C 0 30, 160 30, 160 160 L 220 500" 
          stroke="#F3EBDE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    
    <!-- Laser engraved logo branding on the curved bamboo arm -->
    <text x="110" y="240" transform="rotate(70 110 240)" fill="#4A341E" font-size="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" letter-spacing="2">
      EARTH SMILE
    </text>
  </g>
</svg>
